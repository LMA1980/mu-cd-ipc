[package]
name = "mu-cd-ipc"
version = "0.2.1"
edition = "2021"
description = "Zero-copy IPC and distributed deployment RPC contracts for MuConDe continuous delivery"
license = "LGPL-3.0-only WITH LGPL-3.0-linking-exception"
repository = "https://github.com/LMA1980/mu-cd-ipc"

[dependencies]
zerocopy = { version = "0.8", features = ["derive"] }
fory = "1.7"
tokio = { version = "1", features = ["io-util", "sync", "macros", "rt"] }
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
